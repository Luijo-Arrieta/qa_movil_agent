[pytest]
# Configuración de pytest para AutoDroid-AI Agent

# Opciones de test discovery
# Reconoce tanto test_*.py (tests del proyecto) como spec_*.py (tests de usuario)
python_files = test_*.py spec_*.py unit_test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    slow: marca tests que toman mucho tiempo
    integration: marca tests de integración
    unit: marca tests unitarios

# Opciones de salida
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --alluredir=reports/allure-results
    --log-cli-level=INFO
    --log-cli-format="%(asctime)s.%(msecs)03d - %(name)s - %(levelname)s - %(message)s"
    --log-cli-date-format="%Y-%m-%d %H:%M:%S"

# Configuración de logging a archivo
# Los logs se almacenan automáticamente en reports/logs/ con timestamp
# Formato: pytest_YYYYMMDD_HHMMSS.log
# Ver tests/conftest.py para la configuración detallada
log_file_level = DEBUG
log_file_format = %(asctime)s.%(msecs)03d - %(name)s - %(levelname)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout por defecto (en segundos)
timeout = 300

# Directorios de búsqueda
testpaths = tests

