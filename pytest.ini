[pytest]
# Configuración de pytest para AutoDroid-AI Agent

# Opciones de test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    slow: marca tests que toman mucho tiempo
    integration: marca tests de integración
    unit: marca tests unitarios

# Opciones de salida
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout por defecto (en segundos)
timeout = 300

# Directorios de búsqueda
testpaths = tests

