[tool.poetry]
name = "qa-movil-agent"
version = "0.1.0"
description = "Agente de IA autónomo para ejecutar pruebas móviles en Android"
authors = ["Luijo WSL <luis.arrieta@imagineapps.co>"]
readme = "README.md"
packages = [{include = "src"}, {include = "backend"}, {include = "cli"}]

[tool.poetry.dependencies]
python = ">=3.8,<3.15"
appium-python-client = ">=3.1.0"
openai = ">=1.12.0"
anthropic = ">=0.18.0"
python-dotenv = ">=1.0.0"
requests = ">=2.31.0"
toon-format = ">=0.1.0"
fastapi = ">=0.104.0"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}
pydantic = ">=2.0.0"
click = ">=8.1.0"
pyyaml = ">=6.0.0"
rich = ">=13.7.0"
prompt-toolkit = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-timeout = ">=2.1.0"
allure-pytest = ">=2.13.0"
allure-combine = ">=1.0.11"
pyinstaller = ">=6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 300
timeout_method = "thread"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings"
]
markers = [
    "slow: marca tests que toman mucho tiempo",
    "integration: marca tests de integración",
    "unit: marca tests unitarios"
]

[tool.poetry.scripts]
qa-agent = "cli.main:main"

